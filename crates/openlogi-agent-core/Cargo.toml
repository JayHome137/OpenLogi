[package]
name = "openlogi-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless orchestration shared by the OpenLogi background agent: hook runtime, HID++ writes, DPI cycle, Actions Ring session state."
# Links path-only siblings and is bundled inside the .app via openlogi-agent.
publish = false

[dependencies]
axwatch = { workspace = true }
openlogi-core = { path = "../openlogi-core", features = ["worker"] }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
openlogi-flow = { path = "../openlogi-flow" }
buffa = { workspace = true }
# The embedded action icons only — not the GPUI asset source.
openlogi-ui = { path = "../openlogi-ui", default-features = false }
futures-lite = { workspace = true }
rand = { workspace = true }
# The machine name announced to Flow peers.
gethostname = "1.1"
# The keypad LCD watcher's doubling retry delay.
backon = { workspace = true }
# Keypad LCD tiles: rasterize an action icon's SVG and encode it as the JPEG
# the keypad's image write carries. resvg matches the version gpui links.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
resvg = { version = "0.46", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[lints]
workspace = true

[dev-dependencies]
openlogi-device = { path = "../openlogi-device", features = ["test-support"] }
# Only to advance virtual time in the DeviceOp/timed timeout test without a
# real multi-second sleep.
openlogi-fixture = { workspace = true, features = ["fs"] }
# Keypad identities the orchestrator tests stand a wired keypad up from.
openlogi-device-registry = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
