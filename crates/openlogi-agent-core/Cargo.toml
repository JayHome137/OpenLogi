[package]
name = "openlogi-agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless orchestration shared by the OpenLogi background agent: hook runtime, HID++ writes, DPI cycle, Actions Ring session state."
# Links path-only siblings and is bundled inside the .app via openlogi-agent.
publish = false

[dependencies]
axwatch = { workspace = true }
openlogi-core = { path = "../openlogi-core", features = ["worker"] }
openlogi-inject = { path = "../openlogi-inject" }
openlogi-hid = { path = "../openlogi-hid" }
openlogi-hook = { path = "../openlogi-hook" }
openlogi-ipc = { path = "../openlogi-ipc" }
openlogi-flow = { path = "../openlogi-flow" }
buffa = { workspace = true }
futures-lite = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSPasteboard"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[lints]
workspace = true

[dev-dependencies]
# Only to advance virtual time in the DeviceOp/timed timeout test without a
# real multi-second sleep.
openlogi-fixture = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
