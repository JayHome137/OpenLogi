name: Sync upstream code

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-code-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Promote latest upstream master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out master branch
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch latest upstream master commit
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/AprilNEA/OpenLogi.git
          git fetch --no-tags upstream refs/heads/master
          sha="$(git rev-parse FETCH_HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream master: $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge upstream master into fork master
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          git switch --force-create master origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "master already contains upstream master commit $UPSTREAM_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit --no-ff "$UPSTREAM_SHA"; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort || true
            {
              echo "## Upstream master needs conflict review"
              echo
              echo "master was left unchanged because upstream master commit $UPSTREAM_SHA conflicts with its current contents:"
              echo
              echo '```text'
              echo "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin HEAD:refs/heads/master
          echo "Merged upstream master commit $UPSTREAM_SHA into fork master while preserving the scheduled workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Create or reuse custom sync PR
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base openlogi-custom --head "$GITHUB_REPOSITORY_OWNER:master" --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            echo "Reused PR #$pr_number from master into openlogi-custom for upstream master commit $UPSTREAM_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            body="$(printf '%s\n' '## Summary' '' "Merge upstream master code at $UPSTREAM_SHA from master into openlogi-custom." '' '## Testing' '' 'CI runs on this pull request.')"
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base openlogi-custom --head master --title "chore(upstream): sync master code" --body "$body")"
            echo "Created upstream code sync PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          fi
