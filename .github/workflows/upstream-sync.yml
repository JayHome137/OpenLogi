name: Sync upstream release source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-release-source-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Promote latest release source and open custom PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve latest upstream release source
        id: release
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "UPSTREAM_SYNC_TOKEN is required to push the workflow file and trigger PR checks." >&2
            exit 1
          fi
          git remote add upstream https://github.com/AprilNEA/OpenLogi.git
          tag="$(gh api repos/AprilNEA/OpenLogi/releases/latest --jq .tag_name)"
          test -n "$tag"
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release source: $tag ($sha). No release assets are downloaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Merge the release source into master
        id: promote
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.release.outputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          old="$(git rev-parse refs/remotes/origin/master)"
          git switch --force-create master origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            if ! git merge --no-edit --no-ff "$UPSTREAM_SHA"; then
              conflicts="$(git diff --name-only --diff-filter=U || true)"
              git merge --abort || true
              {
                echo "## Upstream release source needs conflict review"
                echo
                echo "master was left unchanged because release source $RELEASE_TAG ($UPSTREAM_SHA) conflicts with these paths:"
                echo
                echo '```text'
                echo "$conflicts"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          git restore --source="$WORKFLOW_SHA" --staged --worktree -- .github/workflows/upstream-sync.yml
          cargo update -p rustls-webpki -p tokio -p webpki-root-certs -p webpki-roots
          git add .github/workflows/upstream-sync.yml
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "ci(fork): sync latest upstream release source"
          fi
          candidate="$(git rev-parse HEAD)"

          if [ "$old" = "$candidate" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "master already matches release source $RELEASE_TAG ($UPSTREAM_SHA) plus the sync workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            if ! git merge-base --is-ancestor "$old" "$candidate"; then
              echo "master cannot advance to release source $RELEASE_TAG without rewriting its history; no push was made." >&2
              exit 1
            fi
            git push \
              "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:refs/heads/master
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "master now contains release source $RELEASE_TAG ($UPSTREAM_SHA), the fork sync workflow, and updated compatible security dependencies ($candidate)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update the PR into openlogi-custom
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base openlogi-custom --head master --json number --jq '.[0].number // empty')"
          body="$(printf '%s\n' \
            '## Summary' \
            '' \
            "Promote source code at upstream release tag $RELEASE_TAG ($UPSTREAM_SHA) from master into openlogi-custom." \
            'The release tag is the code baseline; release assets are not used.' \
            '' \
            '## Testing' \
            '' \
            'GitHub Build and CI checks run on this pull request.')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "chore(upstream): sync release $RELEASE_TAG source" --body "$body"
            echo "Updated open sync PR #$pr_number for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/openlogi-custom...master" --jq .status)"
            if [ "$status" = "ahead" ] || [ "$status" = "diverged" ]; then
              pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base openlogi-custom --head master \
                --title "chore(upstream): sync release $RELEASE_TAG source" --body "$body")"
              echo "Created sync PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "openlogi-custom already contains master; no PR is needed." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
