name: Sync upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Promote latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out custom branch
        uses: actions/checkout@v7
        with:
          ref: openlogi-custom
          fetch-depth: 0

      - name: Find and fetch latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/AprilNEA/OpenLogi/releases/latest --jq .tag_name)"
          test -n "$tag"
          git remote add upstream https://github.com/AprilNEA/OpenLogi.git
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-parse "$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release: $tag ($sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward master to the release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master openlogi-custom
          if ! git merge-base --is-ancestor origin/master "$RELEASE_SHA"; then
            echo "Latest release $RELEASE_TAG is not a fast-forward from origin/master; stopped without rewriting master." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$(git rev-parse origin/master)" != "$RELEASE_SHA" ]; then
            git push origin "$RELEASE_SHA:refs/heads/master"
            echo "Advanced master to $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "master already points to $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge master into custom
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin master openlogi-custom
          git switch --force-create openlogi-custom origin/openlogi-custom
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit origin/master; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            git merge --abort || true
            {
              echo "## Upstream sync needs conflict review"
              echo
              echo "master was advanced to release $RELEASE_TAG. openlogi-custom was left unchanged because the merge has conflicts:"
              echo
              echo '```text'
              echo "$conflicts"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/openlogi-custom)" ]; then
            git push origin HEAD:refs/heads/openlogi-custom
            echo "Merged master release $RELEASE_TAG into openlogi-custom." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "openlogi-custom already contains master release $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
